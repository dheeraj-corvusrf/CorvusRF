name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  # Belt-and-suspenders alongside the push trigger above: a PR merge into dev
  # normally fires both a push event AND this pull_request-closed event as two
  # independent webhook deliveries. On 2026-07-24 a merge into dev silently
  # triggered neither workflow at all (a one-off GitHub Actions delivery miss,
  # confirmed via the Actions API — no run of any kind for that commit). Having
  # a second, independent trigger for the same "PR merged into dev" moment means
  # one missed delivery no longer means no deployment.
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only skip for the pull_request trigger when the PR was closed WITHOUT
    # merging (a rejected/abandoned PR shouldn't deploy anything). Every other
    # trigger (push, workflow_dispatch) always runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Pinned to dev regardless of which trigger fired — the goal is always
      # "deploy dev's current tip," not "build whatever ref the event points at"
      # (the pull_request trigger's default ref is a synthetic merge commit, not
      # the real commit that lands on dev).
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Supabase's anon/publishable key is meant to be public (it ends up in the
          # client bundle regardless) — real access control comes from the Row Level
          # Security policies in supabase/schema.sql, not from keeping this secret.
          VITE_SUPABASE_URL: https://iotzuhuajbsxxuccuihn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_RpyqtM6EeGiT7qc3FyN5Iw_vm0aiuM3
          # Web3Forms access keys are meant to be public/client-side by design.
          VITE_WEB3FORMS_ACCESS_KEY: 5a66f800-1264-49a2-9696-2839afd02485

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
