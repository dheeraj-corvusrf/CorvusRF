name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      site_base:
        description: "Base path to build for (which URL this deploy targets)"
        type: choice
        default: "/"
        options:
          - "/" # corvusre.com (custom domain)
          - "/CorvusRF/" # dheeraj-corvusrf.github.io/CorvusRF/ (project site)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit + integration (Vitest) — pure money-math and mocked-Supabase
      # wrapper functions, no real network/browser needed. A failure here
      # blocks the deploy, same as a failed build would.
      - run: npm run test

      # E2E (Playwright, guest-only subset) — flows that need no sign-in and
      # write no persistent Supabase rows, so they're safe to run against the
      # real Supabase project on every push. Authenticated flows (protest
      # authorization, Stripe checkout) live in e2e/authenticated and are run
      # locally against a seeded test account for now — see
      # e2e/authenticated/helpers.ts.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://iotzuhuajbsxxuccuihn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_RpyqtM6EeGiT7qc3FyN5Iw_vm0aiuM3
          VITE_WEB3FORMS_ACCESS_KEY: 5a66f800-1264-49a2-9696-2839afd02485

      - run: npm run build
        env:
          # Defaults to "/" (corvusre.com) on a normal push; a manual
          # workflow_dispatch run can pick "/CorvusRF/" instead to rebuild
          # for the old project-site URL — see vite.config.ts.
          SITE_BASE: ${{ github.event.inputs.site_base || '/' }}
          # Supabase's anon/publishable key is meant to be public (it ends up in the
          # client bundle regardless) — real access control comes from the Row Level
          # Security policies in supabase/schema.sql, not from keeping this secret.
          VITE_SUPABASE_URL: https://iotzuhuajbsxxuccuihn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_RpyqtM6EeGiT7qc3FyN5Iw_vm0aiuM3
          # Web3Forms access keys are meant to be public/client-side by design.
          VITE_WEB3FORMS_ACCESS_KEY: 5a66f800-1264-49a2-9696-2839afd02485

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
